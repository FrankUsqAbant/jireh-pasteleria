    <script>
      // La torta de la portada empieza a armarse cuando llegó su foto (en redes lentas no caen piezas vacías);
      // la foto de la tapa se pide después, para no quitarle velocidad (cae recién a los 1.3 s).
      // Si algo falla, arranca igual a los 4 s.
      (function () {
        var d = document.documentElement;
        var listo = function () { d.classList.add("torta-lista"); };
        var foto = new Image();
        foto.onload = foto.onerror = function () { listo(); new Image().src = "/assets/portada/torta-tapa.webp"; };
        foto.src = "/assets/portada/torta-capas.webp";
        setTimeout(listo, 4000);
      })();
    </script>
